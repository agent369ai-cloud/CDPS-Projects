<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAADEN Comms Platform</title>
    <link rel="stylesheet" href="/fonts/maaden.css" />
    <!-- FOUC prevention: resolve the theme BEFORE first paint. Reads the
         user's persisted preference (light | dark | system) from
         localStorage and stamps data-theme onto <html>. The "theme-ready"
         class is added on next frame so the load-time paint doesn't
         animate colors in. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("maaden-theme") || "system";
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = stored === "system" ? (systemDark ? "dark" : "light") : stored;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute("data-theme-mode", stored);
          window.requestAnimationFrame(function () {
            document.documentElement.classList.add("theme-ready");
          });
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
